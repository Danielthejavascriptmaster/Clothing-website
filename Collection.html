<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="collection.css">

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Erica+One&family=Ranchers&family=Supermercado+One&display=swap');
    </style>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add_shopping_cart" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Erica+One&family=Supermercado+One&display=swap" rel="stylesheet">

</head>
<body>

    <div class="navbar">
        <div class="logo">
            <h1 >Rissi frutti</h1>
        </div>

        

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#">Shop</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">Fashion</a>
            <a href="#">Help</a>
            <a href="#">terms & policy</a>
        </div>

        <div class="search-bar">
            <input type="text" placeholder="Search...">

        </div>

        <div class="icons">
            <p class="fa-solid fa-shopping-cart">Cart (0)</p>
            <p class="fa-solid fa-user">account</p>
            
        </div>
    </div>

    <!-- Filter bar — drop this in above your .product-section in Collection.html -->
<div class="filter-bar">

    <div class="filter-group">
        <label for="category-filter">Category</label>
        <select id="category-filter" class="filter-select">
            <option value="all">All Categories</option>
            <option value="cleats">Cleats</option>
            <option value="sneakers">Sneakers</option>
            <option value="hoodie">Hoodies</option>
            <option value="shirts">Shirts</option>
            <option value="jackets">Jackets</option>
            <option value="accessories">Accessories</option>
            <option value="socks">Socks</option>
            <option value="ball">Balls</option>
        </select>
    </div>

    <div class="filter-group">
        <label for="brand-filter">Brand</label>
        <select id="brand-filter" class="filter-select">
            <option value="all">All Brands</option>
            <option value="Adidas">Adidas</option>
            <option value="Nike">Nike</option>
            <option value="Louis Vuitton">Louis Vuitton</option>
            <option value="Burberry">Burberry</option>
            <option value="Moncler">Moncler</option>
            <option value="Bape">Bape</option>
            <option value="Corteiz">Corteiz</option>
        </select>
    </div>

    <div class="filter-group">
        <label for="price-filter">Price</label>
        <select id="price-filter" class="filter-select">
            <option value="all">Any Price</option>
            <option value="0-100">Under £100</option>
            <option value="100-300">£100 – £300</option>
            <option value="300-600">£300 – £600</option>
            <option value="600-plus">£600+</option>
        </select>
    </div>

    <button id="clear-filters" class="clear-filters-btn">Clear Filters</button>

</div>


            <div class="product-section">

                <section class="hero-1">

                    <img src="assets/images/website-images/green-f50-lamine-yamal-commercial.jpg" alt="Adidas F50" class="hero-image">

                    <div class="heroText">
                        <h1>Pure Speed</h1>
                        <p>adidas F50 Elite</p>
                        <button>Shop Now</button>
                    </div>

                </section>
            </div>


            <div class="product-section">

                <section class="hero-3">

                    <img src="/assets/images/website-images/street-wear-background.jpg" alt="Adidas F50" class="hero-image-3">

                    <div class="heroText">
                        <h1>Timeless style</h1>
                        <p>Street Wear</p>
                        <button>Shop Now</button>
                    </div>

                </section>
                
            </div>



            



           



             

    <script src="data.js"></script>
    <script src="function.js"></script>
</body>
</html>
